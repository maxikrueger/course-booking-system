[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "django-cors-headers>=4.3,<5.0",
    "django-environ>=0.11,<1.0",
    "django-ratelimit>=4.1.0",
    "djangorestframework>=3.15,<4.0",
    "djangorestframework-simplejwt>=5.3,<6.0",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.0,<6.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15,<4.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-django>=4.8,<5.0",
    "ruff>=0.6,<1.0",
    "types-requests>=2.33.0.20260503",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --tb=short"
testpaths = ["courses", "bookings", "admin_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# RUF012: Django Meta class attributes are conventionally mutable lists/tuples.
# RUF001/RUF002: German strings/docstrings use en-dashes intentionally.
# RUF100: Wildcard import noqa is a common settings-split pattern.
ignore = ["E501", "RUF012", "RUF001", "RUF002", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["\\.venv", "migrations/"]
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["django_ratelimit.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "backend.settings.dev"
