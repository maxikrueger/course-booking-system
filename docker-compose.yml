services:
  db:
    image: postgres:16-alpine
    container_name: buchung_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-buchung}
      POSTGRES_USER: ${POSTGRES_USER:-buchung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buchung_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buchung} -d ${POSTGRES_DB:-buchung}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    name: buchung_db_data
